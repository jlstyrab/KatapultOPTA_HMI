name: apk

# Bygger APK:n (KatapultOPTA_HMI etapp E4, D15/H1): vid push till main läggs
# den som artefakt OCH som rullande förhandsrelease "latest"; vid tagg v* blir
# det en riktig release. Paddan laddar ner direkt från GitHub Releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runnern (ubuntu-latest) har Android-SDK:t förinstallerat i $ANDROID_HOME.
      # android-actions/setup-android togs bort: den försöker installera det
      # utgångna paketet "tools" och faller (2026-10-16).
      - name: Android SDK (förinstallerat) — licenser + komponenter
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Bygg debug-APK
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p apk assembleDebug --no-daemon --console=plain

      - name: Döp om
        run: |
          cp apk/app/build/outputs/apk/debug/app-debug.apk KatapultOPTA_HMI.apk
          ls -la KatapultOPTA_HMI.apk
          echo "runtime: $(cat apk/app/src/main/assets/www/RUNTIME_VERSION 2>/dev/null || echo '?')"

      - uses: actions/upload-artifact@v4
        with:
          name: KatapultOPTA_HMI.apk
          path: KatapultOPTA_HMI.apk

      - name: Rullande förhandsrelease "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Senaste bygget (main)
          prerelease: true
          files: KatapultOPTA_HMI.apk
          body: |
            Debug-APK byggd från main, bygge ${{ github.run_number }} (${{ github.sha }}).
            Installera på paddan: tillåt okända källor → öppna KatapultOPTA_HMI.apk.
            Appen hittar Optan via UDP-upptäckt; håll volym ned i 3 s för inställningar.

      - name: Release vid tagg
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KatapultOPTA_HMI.apk
